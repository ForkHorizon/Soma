name: Go Quality Gate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: go-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality-gate:
    name: Go Quality Gate
    runs-on: [self-hosted, macOS, ARM64, ci-scope]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: No Go module
        if: ${{ hashFiles('**/go.mod') == '' }}
        run: echo "No Go module in this repository; skipping Go quality checks."

      - name: Download modules
        if: ${{ hashFiles('**/go.mod') != '' }}
        run: go mod download

      - name: go vet
        if: ${{ hashFiles('**/go.mod') != '' }}
        run: go vet ./...

      - name: gofmt check
        if: ${{ hashFiles('**/go.mod') != '' }}
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
