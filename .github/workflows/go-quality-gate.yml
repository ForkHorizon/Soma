name: Go Quality Gate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: go-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality-gate:
    name: Go Quality Gate
    runs-on: [self-hosted, macOS, ARM64, ci-scope]
    defaults:
      run:
        working-directory: Soma/go_scanner
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure Go
        uses: actions/setup-go@v6
        with:
          go-version-file: Soma/go_scanner/go.mod

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
