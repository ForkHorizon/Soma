name: Swift Quality Gate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: swift-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-quality-gate:
    name: Swift Quality Gate
    runs-on: [self-hosted, macOS, ARM64, ci-scope]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build the configured app scheme
        run: >-
          xcodebuild -project Soma.xcodeproj -scheme Soma -configuration Debug
          -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
